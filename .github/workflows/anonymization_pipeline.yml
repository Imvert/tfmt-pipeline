name: Pipeline de Anonimización QA

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente destino"
        required: true
        default: "qa"
        type: choice
        options: [qa, staging]

  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "sql/**"
      - "config/**"

env:
  PYTHON_VERSION: "3.12"

jobs:
  pre_check:
    name: Verificación de prerequisitos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Verificar archivos del pipeline
        run: |
          test -f config/anonymization_policy.yaml || (echo "ERROR: Falta política YAML" && exit 1)
          test -f pipeline/orchestrator.py || (echo "ERROR: Falta orquestador" && exit 1)
          test -f sql/01_northwind_schema.sql || (echo "ERROR: Falta esquema SQL" && exit 1)
          test -f sql/03_masking_procedures.sql || (echo "ERROR: Falta SP SQL" && exit 1)
          echo "✓ Todos los archivos requeridos presentes"

  run_pipeline:
    name: Ejecutar Pipeline de Anonimización
    runs-on: ubuntu-latest
    needs: pre_check

    services:
      db_produccion:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: northwind_prod
          POSTGRES_USER: prod_user
          POSTGRES_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      db_qa:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: northwind_qa
          POSTGRES_USER: qa_user
          POSTGRES_PASSWORD: ${{ secrets.QA_DB_PASSWORD }}
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Instalar cliente PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Instalar dependencias Python
        run: pip install -r requirements.txt

      - name: Cargar esquema y datos en BD producción
        env:
          PGPASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
        run: |
          psql -h localhost -p 5432 -U prod_user -d northwind_prod -f sql/01_northwind_schema.sql
          psql -h localhost -p 5432 -U prod_user -d northwind_prod -f sql/02_northwind_data.sql
          echo "✓ Base de datos de producción cargada"

      - name: Ejecutar pipeline de anonimización
        continue-on-error: true
        env:
          SOURCE_HOST: localhost
          SOURCE_PORT: 5432
          SOURCE_DB: northwind_prod
          SOURCE_USER: prod_user
          SOURCE_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          TARGET_HOST: localhost
          TARGET_PORT: 5433
          TARGET_DB: northwind_qa
          TARGET_USER: qa_user
          TARGET_PASSWORD: ${{ secrets.QA_DB_PASSWORD }}
          FPE_KEY: ${{ secrets.FPE_KEY }}
          FPE_TWEAK: ${{ secrets.FPE_TWEAK }}
        run: python -m pipeline.orchestrator

       - name: Verificar transformación en BD QA
        env:
          PGPASSWORD: ${{ secrets.QA_DB_PASSWORD }}
        run: |
          echo "── Validación post-pipeline ──"
          psql -h localhost -p 5433 -U qa_user -d northwind_qa -c "
            SELECT customer_id, contact_name, cedula, email FROM customers LIMIT 5;
          "
          echo "── Verificación: 0 cédulas originales en QA ──"
          psql -h localhost -p 5433 -U qa_user -d northwind_qa -c "
            SELECT COUNT(*) AS originales_filtradas FROM customers
            WHERE cedula IN ('1712345678','0924567890','1723456789');
          "

      - name: Generar dump SQL plano de la BD QA anonimizada
        env:
          PGPASSWORD: ${{ secrets.QA_DB_PASSWORD }}
        run: |
          mkdir -p artifacts
          pg_dump -h localhost -p 5433 -U qa_user -d northwind_qa \
            --no-owner --no-privileges \
            -f artifacts/northwind_qa_anonimizada.sql
          echo "✓ Dump SQL generado:"
          ls -lh artifacts/northwind_qa_anonimizada.sql

      - name: Generar dump comprimido (formato custom de PostgreSQL)
        env:
          PGPASSWORD: ${{ secrets.QA_DB_PASSWORD }}
        run: |
          pg_dump -h localhost -p 5433 -U qa_user -d northwind_qa \
            --no-owner --no-privileges \
            -F c -Z 9 \
            -f artifacts/northwind_qa_anonimizada.dump
          echo "✓ Dump custom generado:"
          ls -lh artifacts/northwind_qa_anonimizada.dump

      - name: Generar README de instrucciones de restauración
        run: |
          cat > artifacts/README_RESTAURACION.md << 'EOF'
          # Base de datos QA Anonimizada — Northwind
          
          Generado automáticamente por el pipeline de anonimización en GitHub Actions.
          
          ## Contenido
          
          - `northwind_qa_anonimizada.sql`   — Dump SQL plano (legible, ejecutable con psql)
          - `northwind_qa_anonimizada.dump`  — Dump formato custom comprimido (más rápido)
          
          ## Restaurar en una BD local
          
          ### Opción 1 — Dump SQL plano
          ```bash
          createdb northwind_qa_local
          psql -U postgres -d northwind_qa_local -f northwind_qa_anonimizada.sql
          ```
          
          ### Opción 2 — Dump custom (recomendado)
          ```bash
          createdb northwind_qa_local
          pg_restore -U postgres -d northwind_qa_local northwind_qa_anonimizada.dump
          ```
          
          ## Garantías de cumplimiento LOPDP
          
          - Todos los campos personales de Alto y Medio riesgo están anonimizados
          - Las cédulas están tokenizadas con FPE (Format-Preserving Encryption)
          - Las relaciones entre tablas están preservadas (IIR = 1.0)
          - Tasa de re-identificación = 0.0
          EOF
          echo "✓ README de restauración generado"

      - name: Publicar BD QA anonimizada como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: northwind-qa-anonimizada-${{ github.run_number }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: error

      - name: Guardar logs como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-report-${{ github.run_number }}
          path: |
            logs/
            *.log
          retention-days: 30
          if-no-files-found: ignore

  notify:
    name: Resultado del pipeline
    runs-on: ubuntu-latest
    needs: run_pipeline
    if: always()
    steps:
      - name: Pipeline aprobado — QA habilitado
        if: needs.run_pipeline.result == 'success'
        run: |
          echo "✓ Pipeline completado exitosamente"
          echo "✓ Entorno QA habilitado para el equipo de pruebas"
          echo "✓ Cumplimiento LOPDP: 100%"

      - name: Pipeline con alertas informativas
        if: needs.run_pipeline.result == 'success'
        run: |
          echo "ℹ Pipeline completado con alertas informativas"
          echo "ℹ Las validaciones críticas (IIR, re-identificación) pasaron correctamente"
          echo "ℹ Revisar el reporte para detalles de k-anonimato u otras métricas"

      - name: Pipeline falló — QA bloqueado
        if: needs.run_pipeline.result == 'failure'
        run: |
          echo "✗ Pipeline falló por error técnico crítico"
          echo "✗ Entorno QA BLOQUEADO"
          exit 1
